name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Renovate moves runs-on labels, not matrix values: move ubuntu-26.04 here by hand with
        # the runs-on labels below.
        os: [ubuntu-26.04, macos-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # Run the same pre-commit hooks contributors run locally
  # (.pre-commit-config.yaml). commitlint is at the commit-msg stage
  # and is skipped by `prek run` automatically.
  lint:
    name: lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # tekwizely/pre-commit-golang's go-imports hook calls goimports
      # directly; install it on PATH before prek runs. Renovate's regex
      # manager in renovate.json5 moves the version.
      - run: go install golang.org/x/tools/cmd/goimports@v0.50.0
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        env:
          # renovate: datasource=github-releases depName=j178/prek extractVersion=^v(?<version>.+)$
          PREK_VERSION: 0.5.4
        with:
          prek-version: ${{ env.PREK_VERSION }}

  # Syntax-check the generated bash/zsh/fish completion scripts so a
  # malformed script can't ride out in a release.
  completion-smoke:
    name: completion-smoke
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      - name: Generate completion scripts
        run: |
          mkdir -p ./completions
          go run . __dump-completions ./completions
          ls -la ./completions
      - name: Bash syntax check
        run: bash -n ./completions/go-udap.bash
      - name: Zsh syntax check
        run: zsh -n ./completions/_go-udap
      - name: Fish syntax check
        run: fish -c 'source ./completions/go-udap.fish'

  # Lint PR commit messages against Conventional Commits
  # (commitlint.config.mjs). commitlint is a commit-msg hook that
  # `prek run` skips, so the lint job above doesn't cover it.
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.1 (digest-pinned)
        with:
          configFile: commitlint.config.mjs
