name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  # Run the same pre-commit hooks contributors run locally
  # (.pre-commit-config.yaml). commitlint is at the commit-msg stage
  # and is skipped by `prek run` automatically.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # dnephin/pre-commit-golang's go-imports hook calls goimports
      # directly; install it on PATH before prek runs.
      - run: go install golang.org/x/tools/cmd/goimports@latest
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0
        env:
          # jactionlint's online rules (yo61/global decisions/2026-10-17-retire-zizmor.md).
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: 0.4.13

  # Syntax-check the generated bash/zsh/fish completion scripts so a
  # malformed script can't ride out in a release.
  completion-smoke:
    name: completion-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install zsh and fish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
      - name: Generate completion scripts
        run: |
          mkdir -p ./completions
          go run . __dump-completions ./completions
          ls -la ./completions
      - name: Bash syntax check
        run: bash -n ./completions/go-udap.bash
      - name: Zsh syntax check
        run: zsh -n ./completions/_go-udap
      - name: Fish syntax check
        run: fish -c 'source ./completions/go-udap.fish'

  # Lint PR commit messages against Conventional Commits
  # (commitlint.config.mjs). commitlint is a commit-msg hook that
  # `prek run` skips, so the lint job above doesn't cover it.
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Fork of wagoid/commitlint-github-action. Upstream is unmaintained: no
      # commit to master since 2025-01-14, and it pins @commitlint/ensure ^19,
      # two majors behind. This fork runs commitlint v21 on node 24, and pins its
      # runtime image by digest so the SHA pin here cannot be worked around.
      - uses: yo61/commitlint-github-action@501ff7bb31eb7133c871318c877d0e43cd1ff500  # v6.3.0 (digest-pinned)
        with:
          configFile: commitlint.config.mjs
