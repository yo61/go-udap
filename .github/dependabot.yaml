version: 2

# Commit type decides whether an update ships. release-please treats every
# visible changelog section as releasable, so `deps` both lists an update in
# the changelog and cuts a patch release, while `chore` does neither. The line
# is drawn at what reaches users: only updates that change the published
# package use `deps`. See yo61/jobhound
# decisions/2026-08-13-dependency-updates-and-releases.md.
updates:
  # Pre-existing: pre-commit hook updates (don't remove)
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      hooks:
        patterns: ["*"]

  # Go module updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Module updates ship in the released binary, so they keep `deps`.
    commit-message:
      prefix: "deps"
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions updates (SHA-pinned actions get tag-tracking PRs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # docs/site is pnpm-managed; Dependabot auto-detects pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/docs/site"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7.x is the native (Go) compiler; it drops the JS compiler
      # API that `next build` loads for type-checking. Hold on 6.x until the
      # Next.js/fumadocs toolchain supports the native compiler.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs-site-minor-patch:
        update-types: ["minor", "patch"]
