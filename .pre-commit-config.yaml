repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt
      - id: go-imports
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
  - repo: https://github.com/jdx/jactionlint
    rev: 1027f0a131ab98bc7e191d995bfa15dbed5bbf8f  # frozen: v2.2.0
    hooks:
      - id: jactionlint
  - repo: local
    hooks:
      - id: pnpm-overrides-cite-advisory
        name: pnpm overrides cite the advisory they mitigate
        entry: scripts/check-pnpm-overrides.sh
        language: script
        files: ^docs/site/pnpm-workspace\.yaml$
      - id: pnpm-overrides-check-tests
        name: pnpm overrides check passes its tests
        entry: bats scripts/check-pnpm-overrides.bats
        language: node
        additional_dependencies: ['bats@1.13.0']
        files: ^scripts/check-pnpm-overrides\.
        pass_filenames: false
