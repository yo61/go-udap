allowBuilds:
  esbuild: true
  sharp: true

overrides:
  # A transitive dep resolves postcss 8.4.31 (GHSA-qx2v-qp2m-jg93);
  # pull it to the patched 8.5.10+.
  postcss@<8.5.10: ^8.5.10
  # sharp is an unused optional dep of Next (static export +
  # images.unoptimized disables the only consumer); force past
  # GHSA-f88m-g3jw-g9cj (0.35.0) and the bundled-librsvg
  # GHSA-wq5f-xc86-pv6w (0.35.5). Next declares ^0.34.5, so this
  # overrides it.
  sharp@<0.35.5: ^0.35.5
  # compression (under serve, which pins 1.8.1 exactly) leaks memory
  # when a response closes early — DoS (GHSA-vc2v-76pw-4v95). 1.8.2
  # fixes it.
  compression@<1.8.2: ^1.8.2
  # brace-expansion (via minimatch@3, under serve) is vulnerable to
  # DoS from brace expansion: stack exhaustion in parseCommaParts
  # (GHSA-6j4f-fj2g-mc7p) and on nested groups (GHSA-qhr7-859c-m2p7),
  # and quadratic-time expansion (GHSA-q2hr-2g5m-vwhr). 5.0.12 fixes
  # all three. Still ships a CommonJS build, so minimatch's require()
  # resolves.
  brace-expansion@<5.0.12: ^5.0.12
  # fast-uri (via ajv, under serve) mis-parses hostnames and schemes in
  # several ways: skipped IDN canonicalization (GHSA-5jgf-p345-68v8),
  # malformed IPv6 normalization (GHSA-f65p-4m7j-42xc), repeated
  # hostname percent-decoding (GHSA-fph4-wmhf-6fwf), and percent-encoded
  # scheme normalization (GHSA-jqff-g426-hqxp), and inconsistent host
  # case normalization via percent-encoded octets (GHSA-hrr3-gc8f-f4qj)
  # — host confusion and SSRF. 3.1.8 is the fix for the 3.x line that
  # ajv resolves.
  fast-uri@<3.1.8: ^3.1.8
