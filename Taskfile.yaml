version: '3'
silent: true

vars:
  BINARY_NAME: go-udap
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo dev
  LDFLAGS: -s -w -X go-udap/cli.Version={{.VERSION}}
  MOCKSBR_LDFLAGS: -s -w -X main.Version={{.VERSION}}
  BUILD_FLAGS: -ldflags="{{.LDFLAGS}}" -trimpath
  MOCKSBR_BUILD_FLAGS: -ldflags="{{.MOCKSBR_LDFLAGS}}" -trimpath

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  build:
    desc: Build optimized binary for current platform
    summary: >-
      Builds for the current platform with the version stamped in from `git describe` (so a dirty
      tree reports -dirty), symbols and DWARF stripped, and -trimpath set so no local paths are
      embedded. Fingerprinted on **/*.go, so a second run with nothing changed is skipped —
      silently, since root silent suppresses the up-to-date notice; `task --verbose build` shows
      it.
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BINARY_NAME}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY_NAME}}"

  build:windows:
    desc: Cross-compile for Windows (amd64)
    summary: >-
      Cross-compiles for Windows amd64 to go-udap.exe, same flags and version stamping as build.
      No toolchain beyond Go is needed; it is a plain GOOS/GOARCH build.
    cmds:
      - GOOS=windows GOARCH=amd64 go build {{.BUILD_FLAGS}} -o {{.BINARY_NAME}}.exe .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY_NAME}}.exe"

  build:windows-arm64:
    desc: Cross-compile for Windows (arm64)
    summary: >-
      Cross-compiles for Windows arm64 to go-udap-windows-arm64.exe. Named apart from the amd64
      build so both can sit in the directory at once, which is what build:all relies on.
    cmds:
      - GOOS=windows GOARCH=arm64 go build {{.BUILD_FLAGS}} -o {{.BINARY_NAME}}-windows-arm64.exe .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY_NAME}}-windows-arm64.exe"

  build:linux:
    desc: Cross-compile for Linux (amd64)
    summary: >-
      Cross-compiles for Linux amd64 to go-udap-linux-amd64, same flags and version stamping as
      build.
    cmds:
      - GOOS=linux GOARCH=amd64 go build {{.BUILD_FLAGS}} -o {{.BINARY_NAME}}-linux-amd64 .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY_NAME}}-linux-amd64"

  build:linux-arm64:
    desc: Cross-compile for Linux (arm64)
    summary: >-
      Cross-compiles for Linux arm64 to go-udap-linux-arm64, same flags and version stamping as
      build.
    cmds:
      - GOOS=linux GOARCH=arm64 go build {{.BUILD_FLAGS}} -o {{.BINARY_NAME}}-linux-arm64 .
    sources:
      - "**/*.go"
    generates:
      - "{{.BINARY_NAME}}-linux-arm64"

  build:mocksbr:
    desc: Build mocksbr binary for current platform with version stamped (output at ./bin/mocksbr)
    summary: >-
      Builds the mock Squeezebox responder into bin/mocksbr, stamping the version into
      main.Version rather than the CLI's — it is a separate program with its own flags. This is
      the device the end-to-end tests talk to, so it is a test fixture rather than something
      shipped.
    cmds:
      - mkdir -p bin
      - go build {{.MOCKSBR_BUILD_FLAGS}} -o bin/mocksbr ./cmd/mocksbr
    sources:
      - "**/*.go"
    generates:
      - bin/mocksbr

  build:all:
    desc: Build for all platforms
    summary: >-
      Runs the five platform builds: current, Windows amd64 and arm64, Linux amd64 and arm64. Each
      writes a differently named file, so they accumulate rather than overwrite. It does not build
      mocksbr, and it does not compress — `release` is the one that UPX-packs the Linux and
      Windows binaries.
    cmds:
      - task: build
      - task: build:windows
      - task: build:windows-arm64
      - task: build:linux
      - task: build:linux-arm64

  release:
    desc: 'Build all platforms and UPX-compress the Linux/Windows binaries'
    summary: >-
      Builds every platform through build:all, then UPX-compresses the Linux and Windows binaries
      — roughly 67% smaller. macOS is skipped deliberately rather than overlooked: modern macOS
      rejects UPX-packed binaries, so compressing the darwin builds would ship something that will
      not launch.
    deps: [build:all]
    cmds:
      - command -v upx >/dev/null || { echo "upx not found; install with 'brew install upx'"; exit 1; }
      - upx --best --lzma {{.BINARY_NAME}}-linux-amd64
      - upx --best --lzma {{.BINARY_NAME}}-linux-arm64
      - upx --best --lzma {{.BINARY_NAME}}.exe

  release:stats:
    desc: 'Print a table of GitHub release-asset download counts'
    summary: >-
      Prints a table of download counts for the published release assets, as a thin wrapper over
      the gh-release-stats extension. Install that once before first use — `gh extension install
      yo61/gh-release-stats` — because this task does not check for it and without it you get gh's
      own "unknown command" error. Extra flags pass straight through: `task release:stats --
      --json`.
    cmds:
      - gh release-stats {{.CLI_ARGS}}

  test:
    desc: Run all tests
    summary: >-
      go test ./... — no -race and no -count=1, so results can be served from the test cache and a
      data race will not be reported. test:verbose and test:coverage are the same scope with more
      output; mutation coverage is the separate `mutate` task.
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all tests with verbose output
    summary: >-
      The same tests as `test` with -v, so every test name and its log output is printed. Useful
      when a failure's cause is in the logs rather than the assertion.
    cmds:
      - go test -v ./...

  test:coverage:
    desc: Run tests with coverage report
    summary: >-
      Runs the tests with a coverage profile and renders coverage.html to open in a browser. Both
      coverage.out and coverage.html are build artifacts that `clean` removes.
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  fmt:
    desc: Format all Go files
    summary: >-
      go fmt ./... — this REWRITES files in place. There is no check-only counterpart here, so
      nothing in this Taskfile fails on unformatted code; CI is where that is caught.
    cmds:
      - go fmt ./...

  lint:
    desc: Run go vet
    summary: >-
      go vet ./... only — not golangci-lint. It catches the vet suite's correctness problems, not
      style, and the vulnerability scanners live in the separate `security` task.
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go modules
    summary: >-
      go mod tidy: drops requirements nothing imports and adds any that are missing, rewriting
      go.mod and go.sum. Worth running before a commit that changed imports, since CI will notice
      the difference.
    cmds:
      - go mod tidy

  completions:
    desc: Generate shell completion scripts into ./completions
    summary: >-
      Generates the bash, zsh and fish completion scripts into ./completions via the CLI's own
      hidden __dump-completions command, so they cannot drift from the real command tree.
      goreleaser's before-hooks run the same command, so release archives ship current ones
      whether or not you did.
    cmds:
      - mkdir -p ./completions
      - go run . __dump-completions ./completions
      - echo "Wrote ./completions/{go-udap.bash,_go-udap,go-udap.fish}"

  man:
    desc: 'Generate man pages (section 1) from the cobra command tree into ./man'
    summary: >-
      Regenerates the man pages under ./man from the cobra command tree: go-udap.1 plus one
      go-udap-<sub>.1 for each visible subcommand. You rarely need to run it by hand —
      goreleaser's before-hooks run the same command, so a release archive ships current pages
      whether or not you did.
    cmds:
      - go run ./cmd/docs ./man

  docs:dev:
    desc: 'Run the Fumadocs site locally with hot reload at http://localhost:3000'
    summary: >-
      Serves the Fumadocs site at http://localhost:3000 with hot reload. This is the one to use
      while writing docs. BASE_PATH= overrides the /go-udap default that next.config.mjs sets, so
      assets resolve at the root instead of under /go-udap/_next/... — which is what makes
      localhost work at all. For a production build instead: docs:serve to look at one, docs:build
      to reproduce CI's.
    dir: docs/site
    cmds:
      - BASE_PATH= pnpm dev

  docs:serve:
    desc: 'Production-build the Fumadocs site without basePath and serve it locally'
    summary: >-
      Production-builds the site with no basePath and serves it at http://localhost:3000. Use it
      to check the built output before pushing, when hot reload might be masking a build-only
      problem. For editing use docs:dev; to reproduce exactly what CI publishes use docs:build.
    dir: docs/site
    cmds:
      - BASE_PATH= SITE_URL=http://localhost:3000 pnpm build
      - pnpm start

  docs:build:
    desc: 'Production build of the Fumadocs site with the /go-udap basePath, as CI does'
    summary: >-
      Production-builds the site the way CI does, keeping the /go-udap basePath that
      next.config.mjs defaults to, so it reproduces what .github/workflows/docs.yaml publishes to
      GitHub Pages. It is for checking the build, not for viewing it — served locally, that
      basePath makes the assets 404. Use docs:serve to look at the output and docs:dev to edit.
    dir: docs/site
    cmds:
      - pnpm build

  clean:
    desc: Remove build artifacts
    summary: >-
      Removes everything the build tasks produce: the five platform binaries, bin/, man/,
      coverage.out and coverage.html, .verify/ and mocksbr/mocksbr. Nothing tracked is touched, so
      it is safe to run whenever the tree looks cluttered.
    cmds:
      - rm -f {{.BINARY_NAME}} {{.BINARY_NAME}}.exe {{.BINARY_NAME}}-windows-arm64.exe
      - rm -f {{.BINARY_NAME}}-linux-amd64 {{.BINARY_NAME}}-linux-arm64
      - rm -rf bin/ man/
      - rm -f coverage.out coverage.html
      # .verify/ caches an extracted release archive; mocksbr/mocksbr is the
      # pre-bin/ output path. Both are gitignored, so they linger unnoticed
      # and turn up as stale packages in local syft/grype scans.
      - rm -rf .verify/
      - rm -f mocksbr/mocksbr

  run:
    desc: Build and print help (CLI is single-shot; pass args explicitly)
    summary: >-
      Builds, then runs the binary with --help. The CLI is single-shot rather than a daemon, so
      there is nothing to leave running — pass real arguments explicitly if you want to do more
      than see the help.
    cmds:
      - task: build
      - ./{{.BINARY_NAME}} --help

  dev:
    desc: Run without building; pass CLI args via -- (e.g. task dev -- discover)
    summary: >-
      Runs straight from source with `go run`, skipping the build: `task dev -- discover`. Faster
      to iterate with than build-then-run, and it leaves no binary behind, but it is unstamped so
      `--version` reports nothing useful.
    cmds:
      - go run . {{.CLI_ARGS}}

  mutate:
    desc: 'Run mutation testing against udap/getdata_response.go'
    summary: >-
      Mutation-tests one file: udap/getdata_response.go, the protocol parser. Its tests are
      deterministic, so a surviving mutant is a real gap in them rather than noise. This is a
      periodic audit, not a per-change check — a run takes minutes, which is why it is not in CI.
      For any other file, call the tool directly: `go-mutesting <file>`. Whole-package runs
      (./udap/...) are not worth it: the timeout-sensitive tests there — transport,
      socket_unblock, multi_transport — flake under concurrent mutation and fill the survivor list
      with false positives.
    cmds:
      - command -v go-mutesting >/dev/null || { echo "go-mutesting not in PATH; run 'go install github.com/avito-tech/go-mutesting/cmd/go-mutesting@latest'"; exit 1; }
      - go-mutesting udap/getdata_response.go

  security:
    desc: 'Run govulncheck + grype locally (matches CI)'
    summary: >-
      Runs the same two scanners CI does: govulncheck, which is Go-native and reachability-aware,
      then grype against an in-process SBOM for broader CVE coverage. Both are advisory here — CI
      is authoritative. grype is optional: the task says so on stderr and carries on without it,
      so a local pass proves less than a CI pass.
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - |
        if command -v grype >/dev/null 2>&1; then
          grype dir:.
        else
          echo "grype not installed; skipping (brew install grype)" >&2
        fi

  update:all:
    desc: 'Refresh dependencies across all CLI-updatable ecosystems'
    summary: >-
      Runs update:go, update:docs and update:hooks — every ecosystem something on the command line
      can bump. GitHub Actions are deliberately absent: Dependabot tracks those by tag. Nothing
      here verifies the result, so run `task test` and `task docs:build` afterwards; a bump that
      breaks the build will not announce itself.
    cmds:
      - task: update:go
      - task: update:docs
      - task: update:hooks

  update:go:
    desc: Update Go modules to latest minor/patch within go.mod ranges
      and tidy go.sum.
    summary: >-
      Runs `go get -u ./...` then `go mod tidy`, so it moves dependencies to their latest minor
      and patch releases within the constraints go.mod already allows, and does not cross a major.
      Nothing here verifies the result — run `task test` afterwards.
    cmds:
      - go get -u ./...
      - go mod tidy

  update:docs:
    desc: 'Update docs/site npm dependencies within their semver ranges via pnpm'
    summary: >-
      Bumps docs/site npm dependencies within the semver ranges package.json already allows,
      writing the new versions to both package.json and pnpm-lock.yaml. A dependency pinned to an
      exact version is left alone, since by definition nothing is in range for it — use
      update:docs-latest to lift those.
    dir: docs/site
    cmds:
      - pnpm update

  update:docs-latest:
    desc: 'Update docs/site npm dependencies to the latest versions, ignoring semver ranges'
    summary: >-
      Bumps docs/site npm dependencies to their latest versions, ignoring the semver ranges in
      package.json and rewriting those ranges to match. This can cross major versions, so treat
      the diff as a change to review rather than a routine refresh, and run `task docs:build`
      before committing.
    dir: docs/site
    cmds:
      - pnpm update --latest

  update:hooks:
    desc: "Update pre-commit hook revisions via 'prek auto-update'"
    summary: >-
      Updates the pinned hook revisions in .pre-commit-config.yaml through `prek auto-update`.
      Only the versions change — which hooks run is whatever the file already lists.
    cmds:
      - command -v prek >/dev/null || { echo "prek not in PATH; install per https://github.com/j178/prek"; exit 1; }
      - prek auto-update
